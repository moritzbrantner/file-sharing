name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Format
        run: cargo +1.98.1 fmt --all --check
      - name: Clippy
        run: cargo +1.98.1 clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo +1.98.1 test --all-features
