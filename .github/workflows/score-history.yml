name: Coding Tooling Score History

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    permissions:
      actions: read
      contents: write
    uses: moritzbrantner/reusable-workflows/.github/workflows/coding-tooling-score-history.yml@a11ca7f3feaca0936803308cf4b150b4150cb99c
    with:
      tier: fast
      strict: true
      install_mode: auto
      history_branch: score-history
